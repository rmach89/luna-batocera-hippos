<?xml version="1.0" encoding="UTF-8"?>
<!-- Amazon Luna: the app's entry, plus each game when Settings > EmulationStation game list is on. -->
<systemList>
  <system>
    <name>luna</name>
    <fullname>Amazon Luna</fullname>
    <manufacturer>Amazon</manufacturer>
    <release>2020</release>
    <hardware>console</hardware>
    <path>/userdata/roms/luna</path>
    <extension>.luna</extension>
    <command>bash /userdata/system/add-ons/luna/Launch-AmazonLuna.sh --from-es %ROM%</command>
    <platform>luna</platform>
    <theme>luna</theme>
  </system>
</systemList>
